name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # The source-sharing path is part of the product's reviewability/security
      # posture. Validate both shell syntax and a real external-review export.
      - name: Validate source export script
        shell: bash
        run: |
          bash -n scripts/export-shareable-source.sh
          bash scripts/export-shareable-source.sh external-review "$RUNNER_TEMP/bcs-one-source-smoke"
          test -f "$RUNNER_TEMP/bcs-one-source-smoke/SOURCE_BUNDLE_MANIFEST.txt"
          test -f "$RUNNER_TEMP/bcs-one-source-smoke/SOURCE_BUNDLE_FILES.txt"

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Compile foundation Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Compile state jobs Bicep
        run: az bicep build --file infra/state-jobs.bicep --stdout > /dev/null
      - name: Compile application Bicep
        run: az bicep build --file infra/apps.bicep --stdout > /dev/null

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test OPA policy
        run: |
          docker run --rm -v "$PWD/policy/rego:/policy" openpolicyagent/opa:1.8.0-static test /policy -v
